name: Offline checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Python offline tests and UI build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.12.5'

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install locked Python dependencies
        run: uv sync --locked --python 3.13 --no-python-downloads

      - name: Install locked frontend dependencies
        run: npm ci --prefix ui --no-fund --no-audit

      - name: Check Python source
        run: .venv\Scripts\ruff.exe check src tests

      - name: Verify exports, receipts, and process recovery with synthetic data
        run: .venv\Scripts\python.exe -m pytest -q tests/test_exports.py tests/test_reliability.py tests/test_process_recovery.py

      - name: Typecheck and build the UI
        run: npm run build --prefix ui
