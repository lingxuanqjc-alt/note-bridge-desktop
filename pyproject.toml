[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "note-bridge-desktop"
version = "1.0.0"
description = "Local-first desktop note export and cross-platform migration"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
  "pywebview==6.2.1",
  "requests>=2.32.4,<3",
  "lxml>=5.4,<7",
  "python-docx>=1.2,<2",
  "Pillow>=11.2,<13",
  "pydantic>=2.11,<3",
  "pycryptodome>=3.23,<4",
  "boto3>=1.43,<2",
]

[project.scripts]
note-bridge = "note_bridge.app:main"

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.12,<1", "pyinstaller>=6.14,<7"]

[tool.hatch.build.targets.wheel]
packages = ["src/note_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
